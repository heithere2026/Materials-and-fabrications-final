<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大三巴收納盒 3D 組裝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: calm workshop model sheet
   IDEA: a laser-cut plywood kit on a turntable
   PICTURE: the assembled box itself, large, orbitable
   COLOUR: stone grey ground, birch wood, burnt engraving brown
   TYPE: Noto Serif TC titles, Noto Sans TC body; LAYOUT: viewer on top, controls + parts list beneath */
:root{color-scheme:light dark;--bg:light-dark(#e9e6e1,#1b1a18);--ink:light-dark(#22201c,#ece7df);--mut:light-dark(#6b655c,#a8a196);--acc:#a4532a;--card:light-dark(#f6f4f0,#26241f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
header{padding:20px max(4vw,16px) 6px}
h1{font:600 clamp(26px,4vw,40px)/1.1 "Noto Serif TC",serif;margin:0}
header p{margin:6px 0 0;color:var(--mut);font-size:15px}
#view{position:relative;height:min(70vh,640px);min-height:360px;margin:12px max(4vw,16px) 0;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,light-dark(#fbfaf8,#34312b),light-dark(#d7d2ca,#151412))}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#tip{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:16px max(4vw,16px)}
.ctl label{display:flex;gap:10px;align-items:center}
input[type=range]{width:min(260px,60vw);accent-color:var(--acc);height:44px}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid light-dark(#cfc8bd,#4a453d);background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.band{padding:8px max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
h2{font:600 20px/1.2 "Noto Serif TC",serif;margin:12px 0 8px}
ol{margin:0;padding-left:1.4em}li{margin:4px 0}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.parts button{text-align:left;font-size:14px;padding:6px 10px;line-height:1.3}
.parts b{color:var(--acc);margin-right:6px}
small{color:var(--mut)}
@media(max-width:700px){.band{grid-template-columns:1fr}}
</style></head><body>
<header><h1>大三巴教堂收納盒 · 3D 組裝圖</h1>
<p>外形約 100 寬 × 101 深 × 110.9 高 mm，板厚 3 mm。零件外形與雕刻線直接取自你的最終檔，位置按初稿 v1 的組裝說明擺放。</p></header>
<div id="view"><div id="tip">拖曳旋轉 · 滾輪縮放</div></div>
<div class="ctl">
<label>拆開程度 <input id="ex" type="range" min="0" max="1" step="0.01" value="0"></label>
<button id="roof" aria-pressed="false">掀起屋頂蓋</button>
<button id="drw" aria-pressed="false">拉出抽屜</button>
<button id="spin" aria-pressed="true">自動旋轉</button>
<button id="back">看背面</button>
</div>
<div class="band" style="grid-template-columns:1fr">
